[package]
name = "ccvl"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Shared CareerVector engine: style contracts, document bundles and the Yrs document engine"
license = "FSL-1.1-ALv2"
readme = "README.md"

[features]
default = []
render = ["dep:ctyp"]
# The Yrs document engine: the CareerVector Y.Doc layout and op catalogue, no I/O.
doc = ["dep:yrs", "dep:base64"]

[dependencies]
anyhow = "1.0"
base64 = { version = "0.22", optional = true }
ctyp = { git = "https://git.corbet.ch/corbet-fsl/ctyp.git", branch = "main", optional = true, default-features = false, features = ["pdf", "pdf-normalize", "raster"] }
cvst = { git = "https://git.corbet.ch/corbet-fsl/cvst.git", branch = "main" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1"
yrs = { version = "0.28", optional = true }

[dev-dependencies]
yrs = "0.28"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
