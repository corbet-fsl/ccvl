[package]
name = "ccvl"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Local-first, deterministic CV and cover-letter compiler"
license = "FSL-1.1-ALv2"
publish = false
build = ".agent/build.rs"

[workspace]
members = [".agent/core"]
resolver = "3"

[lib]
name = "ccvl"
path = ".agent/src/lib.rs"

[[bin]]
name = "ccvl"
path = ".agent/src/main.rs"

# Maintainer release and private downstream routes are tested through the real CLI.
[[test]]
name = "release_evidence"
path = ".agent/tests/release_evidence.rs"

[[test]]
name = "private_check"
path = ".agent/tests/private_check.rs"

[dependencies]
anyhow = "1.0"
ccvl-core = { path = ".agent/core", version = "0.1", features = ["render"] }
cletter = "0.4.2"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
ctypst = { version = "0.3.3", default-features = false, features = ["document-fonts", "format", "pdf", "raster"] }
lopdf = { version = "0.44", default-features = false }
png = "0.18"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
toml = "1.1"
ureq = { version = "3.1", default-features = false, features = ["json", "rustls"] }
walkdir = "2.5"

[dev-dependencies]
pretty_assertions = "1.4"

# Releases not yet on crates.io, taken from their source repositories. Cargo
# ignores this section when ccvl-core is packaged, so the published manifest
# keeps the plain ranges above. Remove an entry once its release is published.
# Canonical forge URL, exact revision: a CI-only commit in one of these
# libraries must not move a pin (build-efficiency rules 6 and 7). Moving a pin
# is an explicit, reviewed edit here plus the lock refresh it causes.
[patch.crates-io]
cdate = { git = "https://git.corbet.ch/corbet-libre/cdate.git", rev = "2dff4ec4ac5a915ec8bcf2bcb0e3c31ad50248de" }
cink = { git = "https://git.corbet.ch/corbet-libre/cink.git", rev = "c9497016f27150aface01c0a4b32aa18d15f87ab" }
cletter = { git = "https://git.corbet.ch/corbet-libre/cletter.git", rev = "940d6f13b385ed48d49f0c53ccb7d3a79bc6e855" }
cnice = { git = "https://git.corbet.ch/corbet-libre/cnice.git", rev = "decad9624261756fba749235ab418ba4c543740a" }
ctypst = { git = "https://git.corbet.ch/corbet-fsl/ctypst.git", rev = "e0f166f2e8f25159be08d11fc3cefd429e6528cd" }

[build-dependencies]
sha2 = "0.10"

# No [profile] table: the fleet profile is the only profile in this manifest.
# The release jobs pass .cargo/release-profile.toml with --config instead
# (build-efficiency rule 2).

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
