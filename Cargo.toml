[package]
name = "ccvl"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Shared CareerVector engine: style contracts, document bundles and the Yrs document engine"
license = "FSL-1.1-ALv2"
readme = "README.md"

[features]
default = ["storage"]
render = ["dep:ctyp"]
# The Yrs document engine: the CareerVector Y.Doc layout and op catalogue, no I/O.
doc = ["dep:yrs", "dep:base64", "dep:url"]
# Persistence through `cvws` (`session::storage`): on by default for native targets; a wasm32 build
# compiles without it whatever the feature says.
storage = ["doc", "dep:cvws"]
# The server-bound session (`session::remote`) over `cvws::RemoteStore`.
remote = ["storage", "dep:cvdb"]

[dependencies]
anyhow = "1.0"
base64 = { version = "0.22", optional = true }
ctyp = { git = "https://git.corbet.ch/corbet-fsl/ctyp.git", branch = "main", optional = true, default-features = false, features = ["pdf", "pdf-normalize", "raster"] }
cvst = { git = "https://git.corbet.ch/corbet-fsl/cvst.git", branch = "main" }
serde = { version = "1.0", features = ["derive", "rc"] }
# preserve_order: embedded JSON strings of job fields keep their key order, as JSON.stringify does.
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
toml = "1.1"
url = { version = "2", optional = true }
yrs = { version = "0.28", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cvws = { version = "0.1", optional = true }
cvdb = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
yrs = "0.28"
tempfile = "3"
flate2 = "1"
cvdb = { version = "0.2", features = ["fake-server"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
