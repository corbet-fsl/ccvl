[package]
name = "ccvl"
version = "0.1.13"
edition = "2024"
rust-version = "1.94"
description = "Shared CareerVector engine: style contracts, document bundles and the Yrs document engine"
license = "FSL-1.1-ALv2"
readme = "README.md"

[features]
# Excel (.xlsx, .xls) import for the jobs transfer (calamine). Off in the editor's wasm; a second wasm module carries it.
sheet = ["core", "dep:calamine"]
# The document locale (wording locale + formatting region) for hosts that pick a letter's locale: cletter's own
# resolver, re-exported so the CLI and TUI call what the web calls. Off for the wasm build (cletter pulls image code).
locale = ["dep:cletter"]
default = ["core", "storage", "sheet"]
render = ["core", "dep:ctyp"]
# The CareerVector job id language: `normalize_url` and `job_id_from_url`. Needs only `sha2` and `url`,
# so small binaries can take ids without the engine:
# `ccvl = { version = "0.1", default-features = false, features = ["jobid"] }`.
jobid = ["dep:sha2", "dep:url"]
# The offline merge policy (`offline`): hybrid logical clock, stale/fresh classification of queued edits and
# the three-way text range merge. No dependencies, so small binaries can take it alone.
offline = []
# Style contracts, bundles, edits and CSV transfer (`style`, `edit`, `transfer`, `contract`).
core = ["dep:anyhow", "dep:cvst", "dep:serde", "dep:serde_json", "dep:toml", "dep:sha2"]
# The Yrs document engine: the CareerVector Y.Doc layout and op catalogue, no I/O.
doc = ["core", "jobid", "offline", "dep:yrs", "dep:base64"]
# Persistence through `cvws` (`session::storage`): on by default for native targets; a wasm32 build
# compiles without it whatever the feature says.
storage = ["doc", "dep:cvws"]
# The server-bound session (`session::remote`) over `cvws::RemoteStore`.
remote = ["storage", "dep:cvdb"]

[dependencies]
cletter = { version = "0.5", optional = true }
calamine = { version = "0.38", default-features = false, optional = true }
anyhow = { version = "1.0", optional = true }
base64 = { version = "0.23", optional = true }
ctyp = { version = "0.1", optional = true, default-features = false, features = ["pdf", "pdf-normalize", "raster"] }
cvst = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive", "rc"], optional = true }
# preserve_order: embedded JSON strings of job fields keep their key order, as JSON.stringify does.
serde_json = { version = "1.0", features = ["preserve_order"], optional = true }
sha2 = { version = "0.10", optional = true }
toml = { version = "1.1", optional = true }
url = { version = "2", optional = true }
yrs = { version = "0.28", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cvws = { version = "0.1", optional = true }
cvdb = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
yrs = "0.28"
tempfile = "3"
flate2 = "1"
serde_json = { version = "1", features = ["preserve_order"] }
cvdb = { version = "0.2", features = ["fake-server"] }

# Every integration test below needs more than `jobid`; `tests/jobid.rs` runs under `jobid` alone.
[[test]]
name = "bundle_v1"
required-features = ["core"]
[[test]]
name = "transfer"
required-features = ["core"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
