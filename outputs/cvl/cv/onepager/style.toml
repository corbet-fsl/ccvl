# Onepager CV family: one A4 page with an optional photo beside the summary.
id = "onepager"
api = 1
settings_adapter = "document-v1"
documents = ["cv"]
supports_locales = ["de-ch", "en-ch"]
pages = [1]
default_pages = 1
substyles = ["standard", "slot-2", "slot-3", "slot-4", "slot-5"]
empty_substyles = ["slot-2", "slot-3", "slot-4", "slot-5"]
defaults = "../../shared/onepager/defaults.toml"

[paper.defaults]
de-ch = "a4"
en-ch = "a4"

[paper.sizes.a4]
size_pt = [595.2756, 841.8898]
label = "A4"

[paper.sizes.a4.settings.page]
paper = "a4"
