content_fields = ["summary", "groups", "allow_thin"]
# Pages 2–4 are the unchanged Harvard D+ continuation, whose entries are
# candidate source files; like Harvard, the style is therefore not exported
# as a reusable bundle. Pages 1 and 2 are identical across every preset.
source_files = ["../harvard/src/entries-de.typ", "../harvard/src/entries-en.typ"]
shared_pages = [1, 2]

[pdf]
version = "1.7"
tagged = true
font_pattern = "^[A-Z]{6}\\+Archivo-(Bold|Italic|Medium|Regular)$"
# Every page carries the name in its header (older samples label page 1).
required_profile_fields = ["name", "email", "phone_label"]
minimum_text_chars = 100

[[metric_rules]]
kind = "cv-summary"
minimum = 5
maximum = 5

[[metric_rules]]
kind = "cluster-category"
minimum = 3
maximum = 3

[[metric_rules]]
kind = "cluster-station"
minimum = 6
maximum = 7

[[metric_rules]]
kind = "cluster-role"
minimum = 6
maximum = 7

[[metric_rules]]
kind = "cluster-bullet"
minimum = 18
maximum = 21
