[cv]
# One flowing paragraph. It must typeset to exactly 5 lines; the checker
# verifies instead of you counting. This generic summary is shared with the
# cluster CV; a real application rewrites it target-specifically.
summary = """Als Physiker mit AI Schwerpunkt arbeite ich zwischen Technik und Management: Anforderungen klären, Umsetzung koordinieren, Entscheide vorbereiten. Ich baue AI-native Prototypen mit Claude Code, Codex, OpenCode und Open Source Technologien und führe Daten und Szenarioanalysen durch. Vor Stakeholdern und Fachlichkeit scheue ich mich nicht und übernehme Mitverantwortung für Lieferung, Termine und Ergebnis. Als EU Bürger mit Ausweis B bin ich ab sofort flexibel für Festanstellung oder Mandat in der Schweiz verfügbar."""
# The approved wording keeps a thin first line instead of being rewritten to fill it.
allow_thin = true
