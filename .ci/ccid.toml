schema = 1
project = "ccvl"

# Reuse suitable provisioned Rust and locked published dependencies.
# Native publication requires every platform receipt, including unavailable executors.

[checks.rust]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "rust"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]
cache_env = ["RUST_TOOLCHAIN", "RUSTUP_TOOLCHAIN"]

[checks.lint]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "lint"]]
cache_tools = [["shellcheck", "--version"], ["actionlint", "--version"], ["reuse", "--version"]]

[checks.documents]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "documents"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["file", "--version"], ["qpdf", "--version"], ["pdfinfo", "-v"], ["jq", "--version"]]
cache_env = ["RUST_TOOLCHAIN", "RUSTUP_TOOLCHAIN"]

[checks.styles]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "styles"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]
cache_env = ["RUST_TOOLCHAIN", "RUSTUP_TOOLCHAIN", "CCVL_CHECK_STYLES"]

[checks.downstream-check]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "downstream-check"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]
cache_env = ["RUST_TOOLCHAIN", "RUSTUP_TOOLCHAIN"]

[checks.release-rust]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-rust"]]

[checks.release-lint]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-lint"]]

[checks.release-native]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-native"]]

[checks.release-linux-deep]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-linux-deep"]]

[checks.release-cross]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-cross"]]

[checks.release-archive]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-archive"]]

[checks.release-check]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-check"]]

[checks.release-publish]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-publish"]]

# The last stage of the release run: a minor release holds platforms that only their own
# executors can run, so it starts the first platform leg (release-windows), which starts the
# next (release-macos) when it has left its evidence. A patch release has no legs.
[checks.release-legs]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-legs"]]

[checks.release-promote]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-promote"]]

# The shipped Windows x86_64 executable, tested in the offline Windows clone.
[checks.release-windows]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "release-windows"]]

[checks.core-package]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "core-package"]]

[checks.core-release]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "rust", "lint", "core-package"]]

# The always-run Linux CI gates (ci.yml jobs rust-native, documents, lint on
# ubuntu-24.04) map to the rust/documents/lint selectors; [checks.styles]
# (`bash .agent/scripts/ci-check.sh styles`) is the exact path CI's documents
# job runs (with CCVL_CHECK_STYLES selection). jobs.verify lists the Linux
# verify set; dispatch-only, secret-bearing, disabled, and
# release/downstream gates stay defined but separate.
# cache_tools pins the tool identities each script arm resolves
# (rustc/cargo for the build arms; shellcheck/actionlint/reuse for
# lint).

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["rust", "documents", "lint", "styles"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[jobs.downstream-check]
scheduler = "forgejo"
runs_on = "linux"
checks = ["downstream-check"]
command = ["ccid:run-declared-checks"]
workflow = "downstream-check"
events = ["manual"]

# Release stages never use a result cache (cache = false): each run proves its own commit.
# One run builds, verifies and drafts the release of the exact main commit; the
# stages run in this order on one runner and are never reused from a cache.
[jobs.release]
scheduler = "forgejo"
runs_on = "linux"
checks = ["release-rust", "release-lint", "release-native", "release-cross", "release-linux-deep", "release-archive", "release-check", "release-publish", "release-legs"]
workflow = "release"
command = ["bash", ".ci/run-release.sh"]
events = ["manual"]

# Promotion is its own explicit run: it re-checks the draft (the evidence of every platform
# leg must be final), re-derives the manifests from the receipts and makes it the public
# release. Nothing is built here.
[jobs.release-promote]
scheduler = "forgejo"
runs_on = "linux"
checks = ["release-promote"]
workflow = "release-promote"
command = ["bash", ".ci/run-release.sh"]
events = ["manual"]

# The Windows leg of a minor release. The release run starts it (its last stage,
# release-legs) and it starts the macOS leg when it has left its evidence; nobody starts it
# by hand, but it can be dispatched for a repair. It does not build the executable: it
# fetches ccvl-windows-x86_64.exe from the draft, proves it is the file the receipt names and
# runs that file, with the test suite built for the same ABI, in the offline Windows clone,
# which the job of the label `windows` owns for its length.
[jobs.release-windows]
scheduler = "forgejo"
runs_on = "windows"
checks = ["release-windows"]
workflow = "release-windows"
command = ["bash", ".ci/run-windows.sh"]
events = ["manual"]

# The macOS leg has no job here: .forgejo/workflows/release-macos.yml is written by hand,
# because ccid ships no macOS build (its tool channel is Linux only) and the shim a rendered
# job starts with needs one. The leg runs in the macOS build clone of the label `macos`,
# builds, tests and packages macos-x86_64 there and cross-builds macos-arm64 (never run), then
# leaves both in the draft (.agent/scripts/macos-leg.sh). The Windows leg starts it.
