schema = 1
project = "ccvl"

# Reuse suitable provisioned Rust and locked published dependencies.
[checks.rust]
kind = "commands"
commands = [
  ["cargo", "fmt", "--all", "--", "--check"],
  ["cargo", "clippy", "--locked", "--all-targets", "--all-features", "--", "-D", "warnings"],
  ["cargo", "test", "--locked", "--all-features"],
  [".ci/check-features.sh"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]
cache_env = ["RUST_TOOLCHAIN", "RUSTUP_TOOLCHAIN"]

[checks.pack]
kind = "pack"
crates = "."

[release]
kind = "library"
version = "Cargo.toml"
registries = ["crates"]
build = ["pack"]

[render]
render_schema = 3

[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["rust"]
workflow = "ci"
command = ["ccid:run-declared-checks"]
