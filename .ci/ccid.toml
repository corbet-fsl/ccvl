schema = 1
project = "ccvl"

# Reuse suitable provisioned Rust and locked published dependencies.
# Native publication requires every platform receipt, including unavailable executors.

[checks.rust]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "rust"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]
cache_env = ["RUST_TOOLCHAIN", "RUSTUP_TOOLCHAIN"]

[checks.lint]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "lint"]]
cache_tools = [["shellcheck", "--version"], ["actionlint", "--version"], ["reuse", "--version"]]

[checks.documents]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "documents"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["file", "--version"], ["qpdf", "--version"], ["pdfinfo", "-v"], ["jq", "--version"]]
cache_env = ["RUST_TOOLCHAIN", "RUSTUP_TOOLCHAIN"]

[checks.styles]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "styles"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]
cache_env = ["RUST_TOOLCHAIN", "RUSTUP_TOOLCHAIN", "CCVL_CHECK_STYLES"]

# An online check of one run: it asks the forge whether the repository is private and reads the
# runner's identity (FORGEJO_ACTIONS, GITHUB_REPOSITORY, GITHUB_EVENT_NAME, the job token). A cached
# check sees only its declared environment, so the guard refused every real run; the check never
# reuses a result and runs with the job's full environment, like the release checks.
[checks.downstream-check]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/ci-check.sh", "downstream-check"]]

# The release (render_schema = 3, [release] below): one run builds the draft, the Windows and macOS
# legs test it on their own runners, promotion makes it public. Release checks never use a result
# cache: each run proves its own commit.
[checks.release-build]
kind = "commands"
cache = false
commands = [["bash", ".ci/release-build.sh"]]

# The shipped Windows x86_64 executable, tested in the offline Windows clone.
[checks.release-windows]
kind = "commands"
cache = false
commands = [["bash", ".ci/run-windows.sh"]]

# macOS x86_64 built and tested natively in the macOS build clone, macOS arm64 cross-built there.
[checks.release-macos]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/macos-leg.sh"]]

# Promotion: the two manifests are derived from the receipts of every leg.
[checks.release-seal]
kind = "commands"
cache = false
commands = [["bash", ".agent/scripts/release-seal.sh"]]

[checks.core-package]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "core-package"]]

[checks.core-release]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "rust", "lint", "core-package"]]

# The always-run Linux CI gates (ci.yml jobs rust-native, documents, lint on
# ubuntu-24.04) map to the rust/documents/lint selectors; [checks.styles]
# (`bash .agent/scripts/ci-check.sh styles`) is the exact path CI's documents
# job runs (with CCVL_CHECK_STYLES selection). jobs.verify lists the Linux
# verify set; dispatch-only, secret-bearing, disabled, and
# release/downstream gates stay defined but separate.
# cache_tools pins the tool identities each script arm resolves
# (rustc/cargo for the build arms; shellcheck/actionlint/reuse for
# lint).

[render]
render_schema = 3

[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["rust", "documents", "lint", "styles"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]

[jobs.downstream-check]
scheduler = "forgejo"
runs_on = "linux"
checks = ["downstream-check"]
command = ["ccid:run-declared-checks"]
workflow = "downstream-check"

# The release surface is rendered from this table (docs: ccid docs/release.md). The jobs release,
# release-windows, release-macos and release-promote are planned from it, not declared.
# Version: Cargo.toml [package]; a patch release holds linux-x86_64 alone, any other version every
# platform of .agent/release-platforms.txt.
[release]
kind = "binary"
version = "Cargo.toml"
platforms = ["linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-arm64", "windows-x86_64", "windows-arm64"]
build = ["release-build"]
legs = { windows = "release-windows", macos = "release-macos" }
seal = ["release-seal"]
manifests = ["manifest.json", "runtime-manifest.json"]
