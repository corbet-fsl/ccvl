name: CI

# Checks for pull requests to the GitHub mirror, on GitHub's free compute. The
# source of truth, the release builds and publication run on Forgejo; a push to
# this mirror never starts anything here.
on:
  pull_request:
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-native:
    name: Native Rust compiler and document contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Install current stable Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt
          rustup run "$RUST_TOOLCHAIN" rustc --version

      - name: Reuse compiled test dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: tests-linux-x86_64
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting, Clippy and locked tests
        env:
          # Hosted runners have 4 vCPUs and 16 GB; the script's defaults stay
          # conservative for unbudgeted workers. Step-level, so cache keys keep.
          CARGO_BUILD_JOBS: "4"
          RUST_TEST_THREADS: "4"
        run: bash .agent/scripts/ci-check.sh rust

  documents:
    name: Scoped document checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Install current stable Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt
          rustup run "$RUST_TOOLCHAIN" rustc --version

      - name: Reuse compiled document-check dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: documents-linux-x86_64
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check workspace data and the selected styles' documents
        env:
          CARGO_BUILD_JOBS: "4"
        run: bash .agent/scripts/ci-check.sh styles

  lint:
    # Always runs: it is quick, parallel, and REUSE must see every new file.
    name: Workflow, shell, and license checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install lint tools
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check workflows and shell scripts
        run: |
          actionlint -shellcheck shellcheck .github/workflows/*.yml
          shellcheck .agent/scripts/*.sh .agent/tests/*.sh ccvl

      - name: Verify bootstrap and existing compiler selection
        run: |
          bash .agent/tests/test_bootstrap.sh
          bash .agent/tests/test_ci_toolchain.sh

      - name: Check REUSE licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
