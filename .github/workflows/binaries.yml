name: Binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  platforms:
    name: Resolve the explicit released platform set
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN: stable
      CARGO_PROFILE_DEV_DEBUG: "0"
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install current stable Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup run "$RUST_TOOLCHAIN" rustc --version

      - name: Reuse compiled dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: tests-linux-x86_64
          cache-bin: false
          cache-on-failure: true
          save-if: false

      - name: Map released platforms to native runners
        id: platforms
        shell: bash
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          source .agent/scripts/release-evidence.sh
          ccvl_prepare_release_evidence
          platforms="$("${CCVL_RELEASE_EVIDENCE_COMMAND[@]}" platforms)"
          matrix="$(jq -cn --arg platforms "$platforms" '
            {
              "linux-x86_64": "ubuntu-24.04",
              "linux-aarch64": "ubuntu-24.04-arm",
              "macos-arm64": "macos-15",
              "macos-x86_64": "macos-15-intel",
              "windows-x86_64": "windows-2025",
              "windows-arm64": "windows-11-arm"
            } as $runners
            | {include: [$platforms | split("\n")[] | select(length > 0)
                | capture("^(?<os>.+)-(?<arch>[^-]+)$") as $target
                | . as $platform
                | $target + {runner: $runners[$platform]}]}
            | if (.include | length) == 0 then error("The released platform set must not be empty.") else . end')"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Release binary (${{ matrix.os }} ${{ matrix.arch }})
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUST_TOOLCHAIN: stable
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install current stable Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup run "$RUST_TOOLCHAIN" rustc --version

      - name: Reuse compiled dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: release-${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build, verify and package the native release
        shell: bash
        run: bash .agent/scripts/native-release.sh "${{ matrix.os }}-${{ matrix.arch }}" "$RUNNER_TEMP/dist"

      - name: Upload the verified platform package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ccvl-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 3
